name: Pusu Sistemi

on:
  schedule:
    - cron: '0 */3 * * *'   # yedek tetik; asıl tetik cron-job.org (30 dk)
  workflow_dispatch:

permissions:
  contents: write           # durum.json'ı repoya kaydedebilmek için
  actions: write            # engelde kendini yeni sunucuda yeniden başlatabilmek için

concurrency:
  group: pusu
  cancel-in-progress: true  # yeni çalışma gelince eskisi kapanır

jobs:
  pusu:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      NTFY_KANAL: ${{ secrets.NTFY_KANAL }}   # zorunlu: Settings → Secrets and variables → Actions
      GH_TOKEN: ${{ github.token }}           # yeni çalışma isteği için (otomatik)
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v5

      - name: Python Kur
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Kütüphaneleri Yükle
        run: |
          pip install --upgrade requests playwright
          # Tarayıcı sadece yedek yol (doğrulama sayfası çıkarsa) için; kurulamazsa nöbet yine başlar
          python -m playwright install --with-deps chromium || echo "::warning::Chromium kurulamadı, yedek yol kapalı"

      - name: Git Ayarı
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Pusu Kodunu Çalıştır
        run: python -u pusu.py

      - name: Hafızayı Kaydet
        if: always()
        run: |
          # Asıl kayıt pusu.py içinde (çakışmada anlamca birleştirir). Bu adım sadece yedek.
          git add durum.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -q -m "Pusu hafızası (kapanış)"
            git push -q origin "HEAD:${GITHUB_REF_NAME}" || echo "Push reddedildi (pusu.py zaten kaydetti)"
          fi

      - name: Hata Kayıtlarını Yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pusu-debug-${{ github.run_number }}
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
